<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LouvExpo</title>
  <link rel="stylesheet" href="styles.css" />
  <script defer src="script.js"></script>
</head>

<div id="confirm-modal" class="modal hidden">
  <div class="modal-content">
    <p id="modal-message">Êtes-vous sûr ?</p>
    <div class="modal-actions">
      <button id="confirm-yes" class="modal-button confirm">Oui</button>
      <button id="confirm-no" class="modal-button cancel">Non</button>
    </div>
  </div>
</div>

<div id="mobile-power-choice-modal" class="modal hidden">
  <div class="modal-content">
    <h2 class="card-title">Alimentation Système</h2>
    <div class="modal-actions-vertical">
      <button id="mobile-power-on" class="power-button" data-power="on">Allumer le Système</button>
      <button id="mobile-power-off" class="power-button" data-power="off">Éteindre le Système</button>
      <button id="mobile-power-cancel" class="toggle">Annuler</button>
    </div>
  </div>
</div>


<button id="service-btn" class="service-btn">Service</button>
<div id="service-modal" class="modal hidden">
  <div class="modal-content">
    <h2>Heures d'utilisation lampes</h2>
    <div id="lampes-info"></div>
    <div class="modal-actions">
      <button id="service-close" class="toggle">Fermer</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden">Message</div>

<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo">
        <img src="images/louvexpo-logo.png" alt="Logo" class="logo-img" />
        <span class="logo-text">LouvExpo</span>
      </div>

      <nav class="navigation">
        <button class="nav-button active" data-page="projecteur">
          <span>📽️</span> Vidéo
        </button>
        <button class="nav-button" data-page="audio">
          <span>🔉</span> Son & Micro
        </button>
        <button class="nav-button mobile-power-btn" id="mobile-power-btn">
          <span>⏻</span>
        </button>
      </nav>

      <div class="power-controls">
        <button class="power-button" data-power="on">Allumer</button>
        <button class="power-button" data-power="off">Éteindre</button>
      </div>

    </aside>

    <main class="main">
      <header>
        <h1 id="page-title">Vidéo</h1>
        <div id="clock"></div>
      </header>

      <section id="projecteur" class="page active">
        <div class="dashboard-grid video-grid">
          
          <div class="card video-section">
            <h3 class="card-title">Contrôle du projecteur</h3>
            <p>État actuel : <strong id="etat-videoproj">Éteint</strong></p>
            <div class="button-group">
              <button class="toggle" data-group="projecteur" data-etat="on">Allumer</button>
              <button class="toggle" data-group="projecteur" data-etat="off">Éteindre</button>
            </div>
          </div>

          <div class="card video-section">
            <h3 class="card-title">Entrée Projecteur</h3>
            <p>Sélection de l'entrée principale</p>
            <div class="button-group">
              <button class="toggle btn-proj-input" data-group="proj-input" data-input="sdi">SDI</button>
              <button class="toggle btn-proj-input active" data-group="proj-input" data-input="hdbt">HDMI</button>
            </div>
          </div>

          <div class="card video-section large-card" id="matrix-source-section">
            <h3 class="card-title">Sélection Source HDMI</h3>
            <p id="active-source">Source active : —</p>
            <div class="button-group">
              <button class="toggle btn-matrix-source" data-group="source" data-source="hdmi1">Ecran</button>
              <button class="toggle btn-matrix-source" data-group="source" data-source="hdmi2">Fond de salle</button>
              <button class="toggle btn-matrix-source" data-group="source" data-source="hdmi3">Régie</button>
            </div>
          </div>

        </div>
      </section>

      <section id="audio" class="page">
        <div class="dashboard-grid audio-grid">

          <div class="card audio-card">
            <label>Micro 1</label>
            <div class="slider-row">
              <input type="range" min="0" max="100" value="50" />
              <span class="slider-value">50</span>
            </div>
            <button class="toggle btn-mute" data-channel="01">Mute</button>
          </div>

          <div class="card audio-card">
            <label>Micro 2</label>
            <div class="slider-row">
              <input type="range" min="0" max="100" value="50" />
              <span class="slider-value">50</span>
            </div>
            <button class="toggle btn-mute" data-channel="02">Mute</button>
          </div>

          <div class="card audio-card">
            <label>Enceinte face</label>
            <div class="slider-row">
              <input type="range" min="0" max="100" value="50" />
              <span class="slider-value">50</span>
            </div>
            <button class="toggle btn-mute" data-channel="03">Mute</button>
          </div>
          
          <div class="card audio-card">
            <label>Enceinte arrière</label>
            <div class="slider-row">
              <input type="range" min="0" max="100" value="50" />
              <span class="slider-value">50</span>
            </div>
            <button class="toggle btn-mute" data-channel="04">Mute</button>
          </div>
          
          <div class="card audio-card">
            <label>Subwoofer</label>
            <div class="slider-row">
              <input type="range" min="0" max="100" value="50" />
              <span class="slider-value">50</span>
            </div>
            <button class="toggle btn-mute" data-channel="05">Mute</button>
          </div>

        </div>
      </section>

      <section id="systeme" class="page">
        <h2>Informations Système</h2>
        <div class="centered">
          <p>Status: <span id="status">En attente...</span></p>
          <button class="toggle" data-group="systeme" data-etat="on">Redémarrer</button>
          <button class="toggle" data-group="systeme" data-etat="off">Éteindre</button>
        </div>
      </section>

    </main>
  </div>
</body>
</html>
